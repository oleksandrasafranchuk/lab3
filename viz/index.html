<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C AST Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f1;
  --panel: #ffffff;
  --ink: #1d1f24;
  --muted: #6b6f78;
  --line: #d9d7cf;
  --link: #b9b6ab;
  --hl: #fff2b8;
  --c-struct: #3d5a98;
  --c-decl: #1f7a6d;
  --c-stmt: #b4561f;
  --c-op: #7a3f9a;
  --c-leaf: #3f7d2c;
  --node-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1c1f24; --ink: #e7e5df; --muted: #9a9ea6; --line: #2e323a;
    --link: #4a4f59; --hl: #4a3f12; --node-bg: #22262d;
    --c-struct: #8aa6e6; --c-decl: #5cc4b2; --c-stmt: #ee9a63; --c-op: #c58ce3; --c-leaf: #8fcf72;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1c1f24; --ink: #e7e5df; --muted: #9a9ea6; --line: #2e323a;
  --link: #4a4f59; --hl: #4a3f12; --node-bg: #22262d;
  --c-struct: #8aa6e6; --c-decl: #5cc4b2; --c-stmt: #ee9a63; --c-op: #c58ce3; --c-leaf: #8fcf72;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
header .file { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--muted); }
header .stats { font-size: 12px; color: var(--muted); margin-right: auto; }
button, label.btn {
  font: inherit; font-size: 12.5px; padding: 6px 11px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
button:hover, label.btn:hover { border-color: var(--muted); }
input[type=file] { display: none; }
main { flex: 1; display: flex; min-height: 0; }
#source {
  width: 38%; max-width: 560px; min-width: 260px; overflow: auto; background: var(--panel);
  border-right: 1px solid var(--line); font-family: "IBM Plex Mono", monospace; font-size: 12.5px; padding: 10px 0;
}
.ln { display: flex; white-space: pre; padding: 0 12px 0 0; line-height: 1.55; cursor: pointer; }
.ln .no { width: 42px; text-align: right; padding-right: 12px; color: var(--muted); user-select: none; flex: none; }
.ln.hl { background: var(--hl); }
#canvas { flex: 1; position: relative; overflow: hidden; }
svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg:active { cursor: grabbing; }
.link { fill: none; stroke: var(--link); stroke-width: 1.4px; }
.role { font-size: 10px; fill: var(--muted); font-family: "IBM Plex Mono", monospace; }
.node rect { fill: var(--node-bg); stroke-width: 1.6px; rx: 7; }
.node .kind { font-size: 9.5px; fill: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.node .label { font-size: 12.5px; font-family: "IBM Plex Mono", monospace; font-weight: 600; }
.node .badge { font-size: 10px; fill: var(--muted); }
.node { cursor: pointer; }
.node.hl rect { stroke-width: 3px; filter: drop-shadow(0 0 4px var(--hl)); }
.node.dim { opacity: .35; }
.legend {
  position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12px;
}
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
#tip {
  position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; max-width: 280px;
}
#tip b { font-family: "IBM Plex Mono", monospace; }
#empty {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
  gap: 10px; color: var(--muted); text-align: center; padding: 24px;
}
#empty code { background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; color: var(--ink); }
body.drag #canvas { outline: 3px dashed var(--c-struct); outline-offset: -8px; }
@media (max-width: 760px) {
  main { flex-direction: column; }
  #source { width: 100%; max-width: none; min-width: 0; height: 32%; border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>C AST Viewer</h1>
  <span class="file" id="file"></span>
  <span class="stats" id="stats"></span>
  <button id="b-expand">Розгорнути все</button>
  <button id="b-collapse">До функцій</button>
  <button id="b-orient">Вертикально</button>
  <button id="b-fit">Вмістити</button>
  <button id="b-theme">Тема</button>
  <label class="btn">Відкрити JSON<input type="file" id="f" accept=".json,.js"></label>
</header>
<main>
  <div id="source"></div>
  <div id="canvas">
    <svg id="svg"></svg>
    <div class="legend">
      <span style="--c: var(--c-struct)">структура</span>
      <span style="--c: var(--c-decl)">оголошення</span>
      <span style="--c: var(--c-stmt)">оператори</span>
      <span style="--c: var(--c-op)">вирази</span>
      <span style="--c: var(--c-leaf)">листки</span>
    </div>
    <div id="tip"></div>
    <div id="empty">
      <div>AST ще не завантажено.</div>
      <div>Згенеруйте файл: <code>./cparse -v viz/ast.js examples/demo.c</code> і оновіть сторінку,</div>
      <div>або відкрийте / перетягніть сюди <code>.json</code> з <code>./cparse -j out.json file.c</code></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="ast.js"></script>
<script>
const CATEGORY = {
  Program: "struct", Function: "struct", Prototype: "struct", Params: "struct", Param: "struct", Block: "struct",
  Decl: "decl", Var: "decl", InitList: "decl",
  If: "stmt", While: "stmt", DoWhile: "stmt", For: "stmt", Return: "stmt", Break: "stmt", Continue: "stmt", ExprStmt: "stmt", Empty: "stmt",
  Assign: "op", BinOp: "op", UnOp: "op", PreIncDec: "op", PostIncDec: "op", Ternary: "op", Cast: "op", Call: "op", Index: "op",
  Id: "leaf", Int: "leaf", Double: "leaf", Char: "leaf", String: "leaf"
};
const COLOR = c => `var(--c-${CATEGORY[c] || "struct"})`;
const SHOW_KIND_ONLY = new Set(["Program", "Params", "Block", "ExprStmt", "If", "While", "DoWhile", "For", "Return", "Break", "Continue", "Empty", "InitList"]);

const svg = d3.select("#svg");
const g = svg.append("g");
const gLinks = g.append("g");
const gNodes = g.append("g");
const tip = document.getElementById("tip");
const zoom = d3.zoom().scaleExtent([0.08, 3]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);

let root = null, vertical = false, uid = 0;

const text = d => SHOW_KIND_ONLY.has(d.data.kind) ? "" : d.data.label;
const width = d => Math.max(64, Math.max(text(d).length * 7.8, d.data.kind.length * 6.4) + 22);
const H = 40;

function load(data) {
  document.getElementById("empty").style.display = "none";
  document.getElementById("file").textContent = data.file || "";
  renderSource(data.source || "");
  root = d3.hierarchy(data.ast);
  root.each(d => { d.id = ++uid; });
  const n = root.descendants().length, depth = root.height;
  document.getElementById("stats").textContent = `${n} вузлів · глибина ${depth}`;
  root.x0 = 0; root.y0 = 0;
  update(root);
  fit(0);
}

function renderSource(src) {
  const el = document.getElementById("source");
  el.innerHTML = "";
  src.replace(/\n$/, "").split("\n").forEach((line, i) => {
    const row = document.createElement("div");
    row.className = "ln";
    row.dataset.line = i + 1;
    row.innerHTML = `<span class="no">${i + 1}</span><span></span>`;
    row.lastChild.textContent = line || " ";
    row.onmouseenter = () => highlightLine(i + 1, true);
    row.onmouseleave = () => highlightLine(null, true);
    el.appendChild(row);
  });
}

function highlightLine(line, fromSource) {
  document.querySelectorAll(".ln").forEach(r => r.classList.toggle("hl", +r.dataset.line === line));
  gNodes.selectAll(".node")
    .classed("hl", d => line != null && d.data.line === line)
    .classed("dim", d => fromSource && line != null && d.data.line !== line);
  if (!fromSource && line != null) {
    const row = document.querySelector(`.ln[data-line="${line}"]`);
    if (row) row.scrollIntoView({ block: "nearest" });
  }
}

function layout() {
  if (vertical) {
    d3.tree().nodeSize([1, 92]).separation((a, b) => (width(a) + width(b)) / 2 + (a.parent === b.parent ? 14 : 30))(root);
    root.each(d => { d.px = d.x; d.py = d.y; });
  } else {
    d3.tree().nodeSize([1, 1]).separation((a, b) => a.parent === b.parent ? 52 : 64)(root);
    const col = [];
    root.each(d => { col[d.depth] = Math.max(col[d.depth] || 0, width(d)); });
    const off = [0];
    for (let i = 1; i < col.length; i++) off[i] = off[i - 1] + col[i - 1] + 70;
    root.each(d => { d.px = off[d.depth] + width(d) / 2; d.py = d.x; });
  }
}

function linkPath(s, t) {
  if (vertical) return d3.linkVertical()({ source: [s.px, s.py + H / 2], target: [t.px, t.py - H / 2] });
  return d3.linkHorizontal()({ source: [s.px + width(s) / 2, s.py], target: [t.px - width(t) / 2, t.py] });
}

function update(src) {
  layout();
  const nodes = root.descendants(), links = root.links();
  const T = svg.transition().duration(350);
  const sx = src.px0 ?? src.px, sy = src.py0 ?? src.py;

  const node = gNodes.selectAll(".node").data(nodes, d => d.id);
  const enter = node.enter().append("g").attr("class", "node")
    .attr("transform", `translate(${sx},${sy})`).attr("opacity", 0)
    .on("click", (e, d) => toggle(d))
    .on("mouseenter", (e, d) => { showTip(e, d); highlightLine(d.data.line, false); })
    .on("mousemove", (e) => moveTip(e))
    .on("mouseleave", () => { tip.style.display = "none"; highlightLine(null, false); });
  enter.append("rect");
  enter.append("text").attr("class", "kind").attr("text-anchor", "middle");
  enter.append("text").attr("class", "label").attr("text-anchor", "middle");
  enter.append("text").attr("class", "badge").attr("text-anchor", "start");

  const all = enter.merge(node);
  all.select("rect")
    .attr("x", d => -width(d) / 2).attr("y", -H / 2).attr("width", width).attr("height", H)
    .attr("stroke", d => COLOR(d.data.kind))
    .attr("stroke-dasharray", d => d._children ? "4 3" : null);
  all.select(".kind").text(d => d.data.kind).attr("y", d => text(d) ? -5 : 4)
    .attr("fill", d => text(d) ? null : COLOR(d.data.kind))
    .style("font-size", d => text(d) ? null : "11.5px").style("font-weight", d => text(d) ? null : 600);
  all.select(".label").text(text).attr("y", 12).attr("fill", d => COLOR(d.data.kind));
  all.select(".badge").text(d => d._children ? `+${d._children.length}` : "")
    .attr("x", d => width(d) / 2 + 5).attr("y", 4);
  all.transition(T).attr("transform", d => `translate(${d.px},${d.py})`).attr("opacity", 1);
  node.exit().transition(T).attr("transform", `translate(${src.px},${src.py})`).attr("opacity", 0).remove();

  const link = gLinks.selectAll(".lk").data(links, d => d.target.id);
  const lenter = link.enter().append("g").attr("class", "lk").attr("opacity", 0);
  lenter.append("path").attr("class", "link").attr("d", () => linkPath({ px: sx, py: sy, data: src.data }, { px: sx, py: sy, data: src.data }));
  lenter.append("text").attr("class", "role").attr("text-anchor", "middle");
  const lall = lenter.merge(link);
  lall.transition(T).attr("opacity", 1);
  lall.select("path").transition(T).attr("d", d => linkPath(d.source, d.target));
  lall.select("text").text(d => d.target.data.role || "")
    .transition(T)
    .attr("x", d => vertical ? (d.source.px + d.target.px) / 2 : (d.source.px + width(d.source) / 2 + d.target.px - width(d.target) / 2) / 2)
    .attr("y", d => vertical ? (d.source.py + d.target.py) / 2 + 3 : (d.source.py + d.target.py) / 2 - 4);
  link.exit().transition(T).attr("opacity", 0).remove();

  root.each(d => { d.px0 = d.px; d.py0 = d.py; });
}

function toggle(d) {
  if (d.children) { d._children = d.children; d.children = null; }
  else if (d._children) { d.children = d._children; d._children = null; }
  else return;
  update(d);
}

function expandAll() {
  (function open(d) {
    if (d._children) { d.children = d._children; d._children = null; }
    (d.children || []).forEach(open);
  })(root);
  update(root);
}

function collapseToFunctions() {
  expandAll();
  root.descendants().forEach(d => {
    if (d.depth >= 1 && d.children) { d._children = d.children; d.children = null; }
  });
  update(root);
  setTimeout(() => fit(), 380);
}

function fit(dur = 450) {
  const ns = root.descendants();
  const x0 = d3.min(ns, d => d.px - width(d) / 2), x1 = d3.max(ns, d => d.px + width(d) / 2 + 24);
  const y0 = d3.min(ns, d => d.py - H / 2), y1 = d3.max(ns, d => d.py + H / 2);
  const box = { x: x0, y: y0, width: x1 - x0, height: y1 - y0 };
  const W = svg.node().clientWidth, Hh = svg.node().clientHeight;
  if (!W) return;
  const k = Math.min(1.2, 0.92 / Math.max(box.width / W, box.height / Hh));
  const t = d3.zoomIdentity.translate(W / 2 - k * (box.x + box.width / 2), Hh / 2 - k * (box.y + box.height / 2)).scale(k);
  svg.transition().duration(dur).call(zoom.transform, t);
}

function showTip(e, d) {
  const x = d.data;
  tip.innerHTML = `<b>${x.kind}</b>${x.label && x.label !== x.kind ? ` · <b>${escapeHtml(x.label)}</b>` : ""}<br>` +
    `рядок: ${x.line}` + (x.ctype ? `<br>тип: ${x.ctype}` : "") + (x.role ? `<br>роль: ${x.role}` : "") +
    `<br>нащадків: ${(d.children || d._children || []).length}`;
  tip.style.display = "block";
  moveTip(e);
}

function moveTip(e) {
  const r = document.getElementById("canvas").getBoundingClientRect();
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 290) + "px";
  tip.style.top = (e.clientY - r.top + 14) + "px";
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function parseFile(txt) {
  const s = txt.trim().replace(/^window\.AST_DATA\s*=\s*/, "").replace(/;\s*$/, "");
  const data = JSON.parse(s);
  return data.ast ? data : { ast: data, source: "", file: "" };
}

function readFile(file) {
  file.text().then(t => {
    try { load(parseFile(t)); } catch (err) { alert("Не вдалося прочитати файл: " + err.message); }
  });
}

document.getElementById("f").onchange = e => e.target.files[0] && readFile(e.target.files[0]);
document.getElementById("b-expand").onclick = () => { if (root) { expandAll(); setTimeout(() => fit(), 380); } };
document.getElementById("b-collapse").onclick = () => root && collapseToFunctions();
document.getElementById("b-fit").onclick = () => root && fit();
document.getElementById("b-orient").onclick = e => {
  vertical = !vertical;
  e.target.textContent = vertical ? "Горизонтально" : "Вертикально";
  if (root) { update(root); setTimeout(() => fit(), 380); }
};
document.getElementById("b-theme").onclick = () => {
  const el = document.documentElement;
  const dark = el.dataset.theme ? el.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  el.dataset.theme = dark ? "light" : "dark";
};
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drag"); });
window.addEventListener("dragleave", () => document.body.classList.remove("drag"));
window.addEventListener("drop", e => {
  e.preventDefault();
  document.body.classList.remove("drag");
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});

if (window.AST_DATA) load(window.AST_DATA);
else document.getElementById("empty").style.display = "flex";
</script>
</body>
</html>
